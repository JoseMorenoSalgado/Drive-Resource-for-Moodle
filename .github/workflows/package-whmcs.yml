name: WHMCS installable package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WHMCS package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-whmcs
          mkdir -p dist-whmcs/whmcs-root/modules/addons
          mkdir -p dist-whmcs/whmcs-root/modules/servers

          cp -a integrations/whmcs/modules/addons/driveresource_gateway             dist-whmcs/whmcs-root/modules/addons/
          cp -a integrations/whmcs/modules/servers/driveresource             dist-whmcs/whmcs-root/modules/servers/
          cp integrations/whmcs/README.md dist-whmcs/whmcs-root/README-Drive-Resource-WHMCS.md

          test -f dist-whmcs/whmcs-root/modules/addons/driveresource_gateway/driveresource_gateway.php
          test -f dist-whmcs/whmcs-root/modules/addons/driveresource_gateway/api/upload-authorize.php
          test -f dist-whmcs/whmcs-root/modules/servers/driveresource/driveresource.php
          grep -F "'version' => '0.5.5'" dist-whmcs/whmcs-root/modules/addons/driveresource_gateway/driveresource_gateway.php

          (
            cd dist-whmcs/whmcs-root
            zip -qr ../elearning-stream-whmcs-0.5.5.zip modules README-Drive-Resource-WHMCS.md
          )

          unzip -Z1 dist-whmcs/elearning-stream-whmcs-0.5.5.zip | grep -q '^modules/addons/driveresource_gateway/'
          unzip -Z1 dist-whmcs/elearning-stream-whmcs-0.5.5.zip | grep -q '^modules/servers/driveresource/'
          if unzip -Z1 dist-whmcs/elearning-stream-whmcs-0.5.5.zip | grep -q '^whmcs-root/'; then
            echo "::error::WHMCS package must extract directly into the WHMCS document root."
            exit 1
          fi

      - name: Upload WHMCS package
        uses: actions/upload-artifact@v4
        with:
          name: elearning-stream-whmcs-0.5.5
          path: dist-whmcs/elearning-stream-whmcs-0.5.5.zip
          if-no-files-found: error
          retention-days: 30
