name: WHMCS installable package

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build WHMCS package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist-whmcs
          mkdir -p dist-whmcs/package/modules/addons
          mkdir -p dist-whmcs/package/modules/servers

          cp -a integrations/whmcs/modules/addons/driveresource_gateway dist-whmcs/package/modules/addons/
          cp -a integrations/whmcs/modules/servers/driveresource dist-whmcs/package/modules/servers/
          cp integrations/whmcs/README.md dist-whmcs/package/README-Elearning-Stream-WHMCS.md

          printf '%s\n' \
            'Elearning Stream Gateway WHMCS Companion 0.5.3' \
            '' \
            'INSTALLATION:' \
            '1. Extract this ZIP directly into the WHMCS document root.' \
            '2. It will place files under:' \
            '   modules/addons/driveresource_gateway/' \
            '   modules/servers/driveresource/' \
            '3. In WHMCS, open Addons -> Elearning Stream Gateway.' \
            '4. Confirm Loaded companion 0.5.3 in Installation Health.' \
            '5. Set Public Gateway URL (recommended: https://stream.elearningcloud.io), configure the video provider, and confirm your Stream product uses Product Type Other.' \
            > dist-whmcs/package/INSTALL-Elearning-Stream-WHMCS.txt

          test -f dist-whmcs/package/modules/addons/driveresource_gateway/driveresource_gateway.php
          test -f dist-whmcs/package/modules/addons/driveresource_gateway/index.php
          test -f dist-whmcs/package/modules/addons/driveresource_gateway/api/upload-authorize.php
          test -f dist-whmcs/package/modules/addons/driveresource_gateway/lib/BackendRegistry.php
          test -f dist-whmcs/package/modules/addons/driveresource_gateway/lib/AdminDashboard.php
          test -f dist-whmcs/package/modules/addons/driveresource_gateway/lib/AuditLogger.php
          test -f dist-whmcs/package/modules/addons/driveresource_gateway/api/usage-report.php
          test -f dist-whmcs/package/modules/servers/driveresource/lib/ClientPortal.php
          test -f dist-whmcs/package/modules/servers/driveresource/lib/Translator.php
          test -f dist-whmcs/package/modules/servers/driveresource/lang/english.php
          test -f dist-whmcs/package/modules/servers/driveresource/lang/spanish.php
          test -f dist-whmcs/package/modules/servers/driveresource/lib/MoodleConnectionProbe.php
          test -f dist-whmcs/package/modules/servers/driveresource/driveresource.php
          test -f dist-whmcs/package/INSTALL-Elearning-Stream-WHMCS.txt
          grep -F "'version' => '0.5.3'" dist-whmcs/package/modules/addons/driveresource_gateway/driveresource_gateway.php

          (
            cd dist-whmcs/package
            zip -qr ../elearning-stream-whmcs-0.5.3.zip \
              modules \
              README-Elearning-Stream-WHMCS.md \
              INSTALL-Elearning-Stream-WHMCS.txt
          )

          unzip -t dist-whmcs/elearning-stream-whmcs-0.5.3.zip
          unzip -Z1 dist-whmcs/elearning-stream-whmcs-0.5.3.zip | grep -q '^modules/addons/driveresource_gateway/driveresource_gateway.php$'
          unzip -Z1 dist-whmcs/elearning-stream-whmcs-0.5.3.zip | grep -q '^modules/servers/driveresource/driveresource.php$'
          if unzip -Z1 dist-whmcs/elearning-stream-whmcs-0.5.3.zip | grep -q '^whmcs-root/'; then
            echo "::error::WHMCS package must extract directly into the WHMCS root; whmcs-root wrapper detected."
            exit 1
          fi

      - name: Upload WHMCS package
        uses: actions/upload-artifact@v4
        with:
          name: elearning-stream-whmcs-0.5.3
          path: dist-whmcs/elearning-stream-whmcs-0.5.3.zip
          if-no-files-found: error
          retention-days: 30
