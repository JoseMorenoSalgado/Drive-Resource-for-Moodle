name: Elearning Stream Moodle 4.5 CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: write

concurrency:
  group: elearning-stream-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3']
        database: [mariadb, pgsql]

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, intl, mbstring, mysqli, pgsql, soap, zip
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle 4.5
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: MOODLE_405_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: PHP lint
        run: moodle-plugin-ci phplint

      - name: Moodle code checker
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc checker
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache lint
        run: moodle-plugin-ci mustache

      - name: JavaScript lint and AMD build check
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: Rebuild AMD bundle for capture
        if: ${{ always() && matrix.php == '8.3' && matrix.database == 'pgsql' }}
        working-directory: moodle
        run: npx grunt amd --root=mod/videoplayer

      - name: Capture generated AMD build
        if: ${{ always() && matrix.php == '8.3' && matrix.database == 'pgsql' }}
        uses: actions/upload-artifact@v4
        with:
          name: generated-amd-build
          path: |
            moodle/mod/videoplayer/amd/build/bunnyupload.min.js
            moodle/mod/videoplayer/amd/build/bunnyupload.min.js.map

      - name: Commit regenerated AMD bundle
        if: ${{ always() && matrix.php == '8.3' && matrix.database == 'pgsql' && github.event_name == 'pull_request' }}
        env:
          HEAD_BRANCH: ${{ github.head_ref }}
        run: |
          cp moodle/mod/videoplayer/amd/build/bunnyupload.min.js /tmp/bunnyupload.min.js
          cp moodle/mod/videoplayer/amd/build/bunnyupload.min.js.map /tmp/bunnyupload.min.js.map
          cd plugin
          git fetch origin "$HEAD_BRANCH"
          git checkout -B "$HEAD_BRANCH" "origin/$HEAD_BRANCH"
          cp /tmp/bunnyupload.min.js amd/build/bunnyupload.min.js
          cp /tmp/bunnyupload.min.js.map amd/build/bunnyupload.min.js.map
          git add amd/build/bunnyupload.min.js amd/build/bunnyupload.min.js.map
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Rebuild Bunny upload AMD bundle"
          git push origin "HEAD:$HEAD_BRANCH"

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
