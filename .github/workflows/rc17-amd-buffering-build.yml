name: RC17 buffering AMD refresh

on:
  push:
    branches:
      - refactor/html5-core-1.1.33-rc17

permissions:
  contents: write

concurrency:
  group: rc17-buffering-amd-refresh
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
        with:
          path: plugin

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: curl, intl, mbstring, mysqli, soap, zip
          ini-values: max_input_vars=5000, opcache.enable_cli=1
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project -n --no-dev --prefer-dist moodlehq/moodle-plugin-ci ci ^4
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"

      - name: Install Moodle 4.5
        env:
          DB: mariadb
          MOODLE_BRANCH: MOODLE_405_STABLE
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: Rebuild AMD assets
        shell: bash
        run: |
          cd moodle/mod/videoplayer/amd
          npx grunt amd --max-lint-warnings=0
          cd ../../../..
          cp -f moodle/mod/videoplayer/amd/build/*.min.js plugin/amd/build/
          cp -f moodle/mod/videoplayer/amd/build/*.min.js.map plugin/amd/build/
          test -f plugin/amd/build/nativevideo.min.js
          test -f plugin/amd/build/nativevideo.min.js.map

      - name: Commit generated assets
        shell: bash
        run: |
          cd plugin
          rm -f .github/workflows/rc17-amd-buffering-build.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add amd/build .github/workflows/rc17-amd-buffering-build.yml
          if git diff --cached --quiet; then
            echo "AMD assets already current."
            exit 0
          fi
          git commit -m "build: refresh AMD assets after buffering recovery fix"
          git push
