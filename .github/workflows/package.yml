name: Moodle installable package

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Moodle plugin ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/videoplayer
          rsync -a             --exclude='.git'             --exclude='.github'             --exclude='.moodle-plugin-ci.yml'             --exclude='dist'             --exclude='integrations'             --exclude='tests'             ./ dist/videoplayer/

          grep -F "\$plugin->version = 2026092505;" dist/videoplayer/version.php
          grep -F "\$plugin->release = '1.2.0-rc6-m45';" dist/videoplayer/version.php
          test -f dist/videoplayer/db/install.xml
          test -f dist/videoplayer/db/upgrade.php
          test -f dist/videoplayer/protected.php
          test -f dist/videoplayer/gateway-status.php
          test -f dist/videoplayer/classes/local/transfer_meter.php
          test -f dist/videoplayer/classes/task/sync_transfer_usage.php
          test -f dist/videoplayer/amd/build/nativevideo.min.js
          test -f dist/videoplayer/thirdpartylibs/pdfjs/pdf.min.mjs
          test -f dist/videoplayer/thirdpartylibs/pdfjs/pdf.worker.min.mjs

          (
            cd dist
            zip -qr elearning-stream-1.2.0-rc6-m45.zip videoplayer
          )

      - name: Upload Moodle package
        uses: actions/upload-artifact@v4
        with:
          name: elearning-stream-moodle-1.2.0-rc6-m45
          path: dist/elearning-stream-1.2.0-rc6-m45.zip
          if-no-files-found: error
          retention-days: 30
