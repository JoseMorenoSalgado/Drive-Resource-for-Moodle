name: RC17 final coding-style fixes

on:
  push:
    branches:
      - refactor/html5-core-1.1.33-rc17

permissions:
  contents: write

concurrency:
  group: rc17-final-style-fixes
  cancel-in-progress: true

jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apply remaining Moodle code checker fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, content):
              Path(path).write_text(content, encoding="utf-8", newline="\n")

          def remove_internal_check(content):
              return content.replace("\ndefined('MOODLE_INTERNAL') || die();\n", "\n")

          # Backup activity task docblocks.
          path = "backup/moodle2/backup_videoplayer_activity_task.class.php"
          c = read(path)
          c = c.replace(
              "class backup_videoplayer_activity_task extends backup_activity_task {\n    protected function define_my_settings() {",
              """/**
 * Backup task implementation for Drive Resource.
 */
class backup_videoplayer_activity_task extends backup_activity_task {
    /**
     * Define module-specific backup settings.
     *
     * @return void
     */
    protected function define_my_settings() {"""
          )
          c = c.replace(
              "    protected function define_my_steps() {",
              """    /**
     * Define the backup execution steps.
     *
     * @return void
     */
    protected function define_my_steps() {"""
          )
          c = c.replace(
              "    public static function encode_content_links($content) {",
              """    /**
     * Encode Drive Resource links for backup portability.
     *
     * @param string $content Content containing activity links.
     * @return string Encoded backup content.
     */
    public static function encode_content_links($content) {"""
          )
          write(path, c)

          # Restore activity task docblocks.
          path = "backup/moodle2/restore_videoplayer_activity_task.class.php"
          c = read(path)
          c = c.replace(
              "class restore_videoplayer_activity_task extends restore_activity_task {\n    protected function define_my_settings() {",
              """/**
 * Restore task implementation for Drive Resource.
 */
class restore_videoplayer_activity_task extends restore_activity_task {
    /**
     * Define module-specific restore settings.
     *
     * @return void
     */
    protected function define_my_settings() {"""
          )
          c = c.replace(
              "    protected function define_my_steps() {",
              """    /**
     * Define the restore execution steps.
     *
     * @return void
     */
    protected function define_my_steps() {"""
          )
          c = c.replace(
              "    public static function define_decode_contents() {",
              """    /**
     * Define content fields that Moodle must decode during restore.
     *
     * @return restore_decode_content[]
     */
    public static function define_decode_contents() {"""
          )
          c = c.replace(
              "    public static function define_decode_rules() {",
              """    /**
     * Define link decoding rules for restored activities.
     *
     * @return restore_decode_rule[]
     */
    public static function define_decode_rules() {"""
          )
          write(path, c)

          # Remove redundant direct-access guards where files contain declarations only.
          for path in [
              "backup/moodle2/backup_videoplayer_stepslib.php",
              "backup/moodle2/restore_videoplayer_stepslib.php",
              "classes/local/http_range_proxy.php",
              "classes/local/drive_stream_resolver.php",
              "classes/task/cleanup_pdf_cache.php",
              "classes/task/precache_pdf.php",
              "db/upgrade.php",
              "lib.php",
          ]:
              write(path, remove_internal_check(read(path)))

          # Split long reward event description.
          path = "classes/event/reward_awarded.php"
          c = read(path)
          c = c.replace(
              """        return "The user with id '{$this->userid}' earned reward '{$this->other['rewardkey']}' in Drive Resource with id '{$this->other['videoplayerid']}'.";""",
              """        return "The user with id '{$this->userid}' earned reward '{$this->other['rewardkey']}' "
            . "in Drive Resource with id '{$this->other['videoplayerid']}'.";"""
          )
          write(path, c)

          # Split Privacy API interface list.
          path = "classes/privacy/provider.php"
          c = read(path)
          c = c.replace(
              "class provider implements \\core_privacy\\local\\metadata\\provider, \\core_privacy\\local\\request\\core_userlist_provider, \\core_privacy\\local\\request\\plugin\\provider {",
              """class provider implements
    \\core_privacy\\local\\metadata\\provider,
    \\core_privacy\\local\\request\\core_userlist_provider,
    \\core_privacy\\local\\request\\plugin\\provider {"""
          )
          write(path, c)

          # Suppress static login false-positive: access is centralised in activity_context.
          for path in ["view.php", "report.php", "protected.php"]:
              c = read(path)
              c = c.replace(
                  "require(__DIR__ . '/../../config.php');",
                  "// Access is enforced immediately by activity_context::require_from_cmid().\n"
                  "// phpcs:ignore moodle.Files.RequireLogin.Missing\n"
                  "require(__DIR__ . '/../../config.php');"
              )
              write(path, c)

          # Add PHPUnit coverage metadata.
          path = "tests/drive_test.php"
          c = read(path)
          c = c.replace(
              " * @license    http://www.gnu.org/copyleft/gpl.html GNU GPL v3 or later\n */",
              " * @license    http://www.gnu.org/copyleft/gpl.html GNU GPL v3 or later\n"
              " * @covers     \\mod_videoplayer\\local\\drive\n */"
          )
          write(path, c)

          path = "tests/upstream_url_policy_test.php"
          c = read(path)
          c = c.replace(
              " * @license    http://www.gnu.org/copyleft/gpl.html GNU GPL v3 or later\n */",
              " * @license    http://www.gnu.org/copyleft/gpl.html GNU GPL v3 or later\n"
              " * @covers     \\mod_videoplayer\\local\\stream\\upstream_url_policy\n */"
          )
          write(path, c)

          # Wrap long XMLDB upgrade lines.
          path = "db/upgrade.php"
          c = read(path)
          c = c.replace(
              """            $DB->execute("UPDATE {videoplayer} SET completionpercentage = 80 WHERE completionpercentage IS NULL OR completionpercentage = 0");""",
              """            $sql = "UPDATE {videoplayer}
                       SET completionpercentage = 80
                     WHERE completionpercentage IS NULL OR completionpercentage = 0";
            $DB->execute($sql);"""
          )
          replacements = {
              "$videourlfield = new xmldb_field('videourl', XMLDB_TYPE_CHAR, '1024', null, XMLDB_NOTNULL, null, '', 'source');":
              """$videourlfield = new xmldb_field(
                'videourl',
                XMLDB_TYPE_CHAR,
                '1024',
                null,
                XMLDB_NOTNULL,
                null,
                '',
                'source'
            );""",
              "$sourcefield = new xmldb_field('source', XMLDB_TYPE_CHAR, '32', null, XMLDB_NOTNULL, null, 'googledrive', 'introformat');":
              """$sourcefield = new xmldb_field(
                'source',
                XMLDB_TYPE_CHAR,
                '32',
                null,
                XMLDB_NOTNULL,
                null,
                'googledrive',
                'introformat'
            );""",
              "$typefield = new xmldb_field('type', XMLDB_TYPE_CHAR, '32', null, XMLDB_NOTNULL, null, 'auto', 'videourl');":
              """$typefield = new xmldb_field(
                'type',
                XMLDB_TYPE_CHAR,
                '32',
                null,
                XMLDB_NOTNULL,
                null,
                'auto',
                'videourl'
            );""",
              "$completionfield = new xmldb_field('completionpercentage', XMLDB_TYPE_INTEGER, '3', null, XMLDB_NOTNULL, null, '80', 'endtime');":
              """$completionfield = new xmldb_field(
                'completionpercentage',
                XMLDB_TYPE_INTEGER,
                '3',
                null,
                XMLDB_NOTNULL,
                null,
                '80',
                'endtime'
            );""",
          }
          for old, new in replacements.items():
              c = c.replace(old, new)
          write(path, c)

          # Document the local PDF file-area constant.
          path = "lib.php"
          c = read(path)
          c = c.replace(
              "const VIDEOPLAYER_LOCALPDF_FILEAREA = 'localpdf';",
              """/**
 * File area used for protected local PDF resources.
 */
const VIDEOPLAYER_LOCALPDF_FILEAREA = 'localpdf';"""
          )
          write(path, c)

          # Moodle requires language string keys in alphabetical order.
          for path in ["lang/en/videoplayer.php", "lang/es/videoplayer.php"]:
              c = read(path)
              lines = c.splitlines()
              first = next(i for i, line in enumerate(lines) if re.match(r"^\$string\['[^']+'\]\s*=", line.strip()))
              prefix = lines[:first]
              assignments = [line for line in lines[first:] if re.match(r"^\$string\['[^']+'\]\s*=", line.strip())]
              assignments.sort(key=lambda line: re.match(r"^\$string\['([^']+)'\]", line).group(1))
              write(path, "\n".join(prefix).rstrip() + "\n\n" + "\n".join(assignments) + "\n")

      - name: Commit fixes
        shell: bash
        run: |
          rm -f .github/workflows/rc17-final-fixes.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No remaining style changes."
            exit 0
          fi
          git commit -m "style: resolve remaining Moodle code checker findings"
          git push
