name: Moodle 4.5–5.0 compatibility

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

concurrency:
  group: moodle-supported-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: PHP ${{ matrix.php }} · ${{ matrix.database }} · Moodle ${{ matrix.moodle.label }}
    runs-on: ubuntu-22.04

    strategy:
      fail-fast: false
      matrix:
        moodle:
          - label: '4.5'
            branch: MOODLE_405_STABLE
          - label: '5.0'
            branch: MOODLE_500_STABLE
        php:
          - '8.2'
          - '8.3'
        database:
          - mariadb
          - pgsql

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ALLOW_EMPTY_ROOT_PASSWORD: 'yes'
          MARIADB_CHARACTER_SET_SERVER: utf8mb4
          MARIADB_COLLATION_SERVER: utf8mb4_unicode_ci
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mariadb-admin ping --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Check out plugin
        uses: actions/checkout@v4
        with:
          path: plugin

      - name: Set up PHP ${{ matrix.php }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, dom, fileinfo, gd, intl, mbstring, mysqli, pgsql, simplexml, soap, sodium, xml, xmlreader, zip
          ini-values: max_input_vars=5000, memory_limit=512M
          coverage: none

      - name: Install Moodle Plugin CI
        run: |
          composer create-project --no-interaction --no-dev --prefer-dist moodlehq/moodle-plugin-ci:^4 ci
          echo "$(pwd)/ci/bin" >> "$GITHUB_PATH"
          echo "$(pwd)/ci/vendor/bin" >> "$GITHUB_PATH"
          sudo locale-gen en_AU.UTF-8

      - name: Install Moodle ${{ matrix.moodle.label }} test environment
        env:
          DB: ${{ matrix.database }}
          MOODLE_BRANCH: ${{ matrix.moodle.branch }}
        run: moodle-plugin-ci install --plugin ./plugin --db-host=127.0.0.1

      - name: PHP syntax
        run: moodle-plugin-ci phplint

      - name: Moodle coding style
        run: moodle-plugin-ci phpcs --max-warnings 0

      - name: PHPDoc
        run: moodle-plugin-ci phpdoc --max-warnings 0

      - name: Plugin validation
        run: moodle-plugin-ci validate

      - name: Upgrade savepoints
        run: moodle-plugin-ci savepoints

      - name: Mustache validation
        run: moodle-plugin-ci mustache

      - name: AMD and JavaScript validation
        run: moodle-plugin-ci grunt --max-lint-warnings 0

      - name: PDF.js native ESM loader contract
        run: |
          BUNDLE=plugin/amd/build/pdfjsloader.min.js
          test -f "$BUNDLE"
          grep -q 'createElement("script")' "$BUNDLE"
          grep -q 'type="module"' "$BUNDLE"
          grep -q 'pdf.worker.min.mjs' "$BUNDLE"
          if grep -q '_systemImportTransformerGlobalIdentifier' "$BUNDLE"; then
            echo 'PDF.js ESM loader was transformed into a RequireJS dynamic import.' >&2
            exit 1
          fi

      - name: Stable PDF.js production contract
        run: |
          VIEW=plugin/view.php
          FORM=plugin/mod_form.php
          LOCALLIB=plugin/locallib.php
          INSTALL=plugin/db/install.xml
          RESTORE=plugin/backup/moodle2/restore_videoplayer_stepslib.php
          SOURCE=plugin/amd/src/pdfviewer.js
          BUNDLE=plugin/amd/build/pdfviewer.min.js
          MAP=plugin/amd/build/pdfviewer.min.js.map
          TEMPLATE=plugin/templates/pdfjs.mustache

          grep -q "mod_videoplayer/pdfviewer" "$VIEW"
          grep -q "render_from_template('mod_videoplayer/pdfjs'" "$VIEW"
          grep -q "videoplayer_get_safe_pdf_displaymode" "$VIEW"
          grep -q "videoplayer_get_safe_pdf_displaymode" "$FORM"
          grep -q "\\['pdfjs'\\]" "$LOCALLIB"
          grep -q 'DEFAULT="pdfjs"' "$INSTALL"
          grep -q "\$data->displaymode = 'pdfjs';" "$RESTORE"
          grep -q 'pdfjs-progress' "$SOURCE"
          grep -q 'pdfjs-points' "$SOURCE"
          grep -q 'pdfjs-achievements' "$SOURCE"
          grep -q 'pdfjs-progress' "$BUNDLE"
          grep -q 'pdfjs-points' "$BUNDLE"
          grep -q 'pdfjs-achievements' "$BUNDLE"
          test -f "$MAP"
          grep -q 'data-display-mode="pdfjs"' "$TEMPLATE"
          grep -q 'data-region="pdfjs-progress"' "$TEMPLATE"
          grep -q 'data-region="pdfjs-points"' "$TEMPLATE"
          grep -q 'data-region="pdfjs-achievements"' "$TEMPLATE"

          if grep -q "mod_videoplayer/ebookviewer" "$VIEW"; then
            echo 'The learner entry point must not load the PageFlip ebook viewer.' >&2
            exit 1
          fi
          if grep -q "mod_videoplayer/bookviewer" "$VIEW"; then
            echo 'The learner entry point must not load the legacy book viewer.' >&2
            exit 1
          fi
          if grep -q "thirdpartylibs/pageflip" "$VIEW"; then
            echo 'The learner entry point must not load PageFlip assets.' >&2
            exit 1
          fi
          if grep -q 'ebook-' "$SOURCE" || grep -q 'ebook-' "$BUNDLE"; then
            echo 'The stable PDF.js viewer contains obsolete ebook regions.' >&2
            exit 1
          fi

      - name: Mobile PDF and video seek contract
        run: |
          grep -Fq "'initialpage' => \$initialpage" plugin/view.php
          grep -q 'styles_pdf_overlay.css' plugin/view.php
          grep -q 'styles_pdf_mobile.css' plugin/view.php
          grep -q 'videomimetype' plugin/templates/video.mustache
          grep -q 'registerSeekRecovery' plugin/amd/src/plyr.js
          grep -q 'slow-2g' plugin/amd/build/plyr.min.js
          grep -q 'emptied' plugin/amd/build/plyr.min.js
          grep -q 'is_range_response_usable' plugin/classes/local/http_range_proxy.php
          grep -q 'UPSTREAM_RANGE_UNSUPPORTED' plugin/classes/local/http_range_proxy.php
          grep -q 'X-Accel-Buffering: no' plugin/classes/local/http_range_proxy.php
          grep -q 'max-width: none !important' plugin/styles_pdf_mobile.css
          grep -q 'mod-videoplayer-pdfjs-canvas-stage' plugin/templates/pdfjs.mustache
          grep -q 'mod-videoplayer-pdfjs-canvas-stage' plugin/styles_pdf_overlay.css
          grep -q 'margin: auto !important' plugin/styles_pdf_mobile.css
          grep -q 'justify-content: flex-start !important' plugin/styles_pdf_mobile.css

      - name: PHPUnit
        run: moodle-plugin-ci phpunit --fail-on-warning
